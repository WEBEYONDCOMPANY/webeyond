name: WEBEYOND production
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: webeyond-production
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Build demos, desktop previews and WEBEYOND
        run: pnpm build
      - name: Worker tests
        run: pnpm test
      - name: Preview and pipeline tests
        run: pnpm test:previews && node --test scripts/ci-pipeline.test.mjs
      - name: Worker dry run and runtime/browser checks
        run: pnpm test:runtime
        env:
          WEBEYOND_PLAYWRIGHT_MODULE: playwright
      - name: Deploy built Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Required Cloudflare deployment secrets are missing."
            exit 1
          fi
          pnpm exec wrangler deploy
